apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability
  namespace: argocd
  annotations:
    # Installs the Prometheus Operator CRDs that other applications' monitors
    # depend on, so it goes first.
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/louisbove84/mnemos.git
    targetRevision: main
    path: deploy/helm/observability
    helm:
      releaseName: observability
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # The Prometheus Operator CRDs exceed the 262144-byte annotation limit
      # that a client-side apply writes into last-applied-configuration.
      # Server-side apply is the only way this chart syncs at all.
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
