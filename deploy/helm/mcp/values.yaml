image:
  repository: mnemos
  tag: "0.1.0"
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  port: 8080

postgres:
  existingSecret: postgres-auth
  host: postgres
  port: 5432
  usernameKey: username
  passwordKey: password
  databaseKey: database

neo4j:
  existingSecret: neo4j-auth
  uri: bolt://neo4j:7687
  user: neo4j
  authKey: auth

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi

probes:
  enabled: true
