apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mcp.fullname" . }}
  labels:
    {{- include "mcp.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "mcp.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mcp.labels" . | nindent 8 }}
    spec:
      containers:
        - name: mcp
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              set -euo pipefail
              export MNEMOS_POSTGRES_DSN="postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@{{ .Values.postgres.host }}:{{ .Values.postgres.port }}/${POSTGRES_DB}"
              export MNEMOS_NEO4J_PASSWORD="${NEO4J_AUTH#*/}"
              exec mnemos-mcp
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          env:
            - name: MNEMOS_MCP_HOST
              value: "0.0.0.0"
            - name: MNEMOS_MCP_PORT
              value: {{ .Values.service.port | quote }}
            - name: MNEMOS_NEO4J_URI
              value: {{ .Values.neo4j.uri | quote }}
            - name: MNEMOS_NEO4J_USER
              value: {{ .Values.neo4j.user | quote }}
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.existingSecret }}
                  key: {{ .Values.postgres.usernameKey }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.existingSecret }}
                  key: {{ .Values.postgres.passwordKey }}
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.existingSecret }}
                  key: {{ .Values.postgres.databaseKey }}
            - name: NEO4J_AUTH
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.neo4j.existingSecret }}
                  key: {{ .Values.neo4j.authKey }}
          {{- if .Values.probes.enabled }}
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
