apiVersion: v2
name: observability
description: Cluster and GPU metrics, with dashboards, for the mnemos platform
type: application
version: 0.1.0

# Versions are exact, not ranges. Phase 2 has to vendor these into an offline
# bundle, and a range is not something you can package.
dependencies:
  - name: kube-prometheus-stack
    version: 88.1.2
    repository: https://prometheus-community.github.io/helm-charts
  - name: dcgm-exporter
    version: 4.8.3
    repository: https://nvidia.github.io/dcgm-exporter/helm-charts
    condition: dcgm-exporter.enabled
