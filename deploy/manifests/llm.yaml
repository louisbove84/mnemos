apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm
  labels:
    app: llm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llm
  template:
    metadata:
      labels:
        app: llm
    spec:
      runtimeClassName: nvidia
      containers:
        - name: llama
          image: ghcr.io/ggml-org/llama.cpp:server-cuda
          args:
            - "--model"
            - "/models/qwen2.5-0.5b/qwen2.5-0.5b-instruct-q4_k_m.gguf"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8000"
            - "--ctx-size"
            - "2048"
            - "--n-gpu-layers"
            - "99"
          ports:
            - name: http
              containerPort: 8000
          resources:
            limits:
              nvidia.com/gpu: "1"
              memory: "6Gi"
            requests:
              cpu: "500m"
              memory: "2Gi"
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
      volumes:
        - name: models
          hostPath:
            path: /srv/mnemos/models
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: llm
spec:
  selector:
    app: llm
  ports:
    - name: http
      port: 8000
      targetPort: 8000
  type: ClusterIP
